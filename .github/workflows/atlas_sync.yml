name: Auto-Sync Atlas Academy Data

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allows you to click "Run workflow" manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          python manage.py migrate

      - name: Execute Atlas Sync Engine
        run: |
          python manage.py sync_servants

      - name: Commit & Push Updated SQLite Database
        run: |
          git config user.name "Chaldea OS Satellite"
          git config user.email "bot@chaldea-os.local"
          
          # Check if db.sqlite3 actually modified
          if [ -n "$(git status --porcelain db.sqlite3)" ]; then
            git add db.sqlite3
            git commit -m "chore(data): auto-sync atlas academy servant roster [skip ci]"
            git push origin main
          else
            echo "Database already up to date. No changes to commit."
          fi