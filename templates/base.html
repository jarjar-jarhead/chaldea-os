<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0a0e17] text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CHALDEA // OS{% endblock %}</title>
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chaldea: {
                            bg: '#0a0e17',
                            surface: '#111927',
                            border: '#1e293b',
                            cyan: '#00e5ff',
                            cyanGlow: 'rgba(0, 229, 255, 0.15)',
                            amber: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for Terminal Styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-tech { font-family: 'JetBrains Mono', monospace; }
        .glow-cyan { box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .border-glow { border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-full pb-20 md:pb-0 bg-[#0a0e17] text-slate-200">

    <!-- Top Navigation (Mobile minimal, Desktop rich) -->
    <header class="sticky top-0 z-40 w-full border-b border-chaldea-border bg-[#0a0e17]/85 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <!-- Brand -->
            <a href="/" class="flex items-center gap-2 font-tech font-bold text-sm tracking-wider text-chaldea-cyan hover:opacity-80 transition">
                <span class="inline-block w-2 h-2 rounded-full bg-chaldea-cyan animate-pulse"></span>
                <span>CHALDEA // OS</span>
            </a>

            <!-- Desktop Links -->
            <nav class="hidden md:flex items-center gap-8 font-tech text-xs tracking-wider text-slate-400">
                <a href="{% url 'servants:roster' %}" class="px-3 py-1.5 rounded border border-transparent hover:border-chaldea-cyan/40 text-slate-300 hover:text-chaldea-cyan transition font-tech text-xs">
                    [ 01 // ROSTER ]
                </a>
                <a href="{% url 'servants:compare' %}" class="px-3 py-1.5 rounded border border-transparent hover:border-chaldea-cyan/40 text-slate-300 hover:text-chaldea-cyan transition font-tech text-xs">
                    [ 02 // COMPARE ]
                </a>
                <a href="/about/" class="hover:text-chaldea-cyan transition {% if '/about' in request.path %}text-chaldea-cyan border-b-2 border-chaldea-cyan py-4{% endif %}">
                    [ 03 // ARCHIVE ]
                </a>
            </nav>

            <!-- Status Indicator -->
            <div class="hidden sm:flex items-center gap-2 font-tech text-[10px] text-slate-500 border border-chaldea-border px-2.5 py-1 rounded bg-chaldea-surface/50">
                <span class="text-chaldea-cyan">DB:</span> CONNECTED
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}
        {% endblock %}
    </main>

<!-- Mobile Bottom Navigation (Sticky thumb bar) -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 h-16 bg-[#0d131f]/95 backdrop-blur-lg border-t border-chaldea-border grid grid-cols-3 items-center px-2">
    
    <!-- 01 // Roster -->
    <a href="{% url 'servants:roster' %}" class="flex flex-col items-center justify-center h-full font-tech text-[10px] tracking-wider transition {% if request.resolver_match.url_name == 'roster' %}text-chaldea-cyan{% else %}text-slate-400 hover:text-slate-200{% endif %}">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
        <span>ROSTER</span>
    </a>

    <!-- 02 // Compare -->
    <a href="{% url 'servants:compare' %}" class="flex flex-col items-center justify-center h-full font-tech text-[10px] tracking-wider transition {% if request.resolver_match.url_name == 'compare' %}text-chaldea-cyan{% else %}text-slate-400 hover:text-slate-200{% endif %}">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span>COMPARE</span>
    </a>

    <!-- 03 // Info / Archive -->
    <a href="{% url 'servants:about' %}" class="flex flex-col items-center justify-center h-full font-tech text-[10px] tracking-wider transition {% if request.resolver_match.url_name == 'about' %}text-chaldea-cyan{% else %}text-slate-400 hover:text-slate-200{% endif %}">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>INFO</span>
    </a>

</nav>

</body>
</html>
